name: App Android

# Compila l'APK su un runner GitHub (che ha l'SDK Android): niente Android
# Studio sul PC. Su main l'APK finisce in una release con link diretto,
# installabile dal browser del telefono.

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml", ".github/scripts/**"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml", ".github/scripts/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # Tutta la storia: le novità dell'APK sono le PR unite dall'ultimo pubblicato.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Senza una chiave fissa ogni runner ne genera una nuova: ogni APK avrebbe
      # una firma diversa e per aggiornare bisognerebbe disinstallare (perdendo
      # le impostazioni). Il secret ANDROID_DEBUG_KEYSTORE_B64 è la chiave in base64.
      #
      # Il file si passa a Gradle per percorso (BALDMUSIC_KEYSTORE, vedi app/build.gradle.kts):
      # copiarlo in ~/.android/debug.keystore non bastava, Gradle ne usava un'altra a ogni build.
      - name: Ripristina la chiave di firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 non impostato: senza la chiave fissa gli aggiornamenti dall'app non funzionano."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/baldmusic.keystore"
          echo "BALDMUSIC_KEYSTORE=$RUNNER_TEMP/baldmusic.keystore" >> "$GITHUB_ENV"
          # L'impronta della chiave (non è un segreto: è scritta in ogni APK), per il controllo dopo la build.
          keytool -list -v -keystore "$RUNNER_TEMP/baldmusic.keystore" -storepass android | tee "$RUNNER_TEMP/chiave.txt" | grep -E "Alias|SHA256" || true
          { grep -m1 "SHA256:" "$RUNNER_TEMP/chiave.txt" || true; } | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f' > "$RUNNER_TEMP/chiave-sha256.txt"
          if [ ! -s "$RUNNER_TEMP/chiave-sha256.txt" ]; then
            echo "::error::La chiave del secret non si apre come chiave di debug di Android (password «android», alias «androiddebugkey»)."
            exit 1
          fi
          echo "Chiave di firma: $(cat "$RUNNER_TEMP/chiave-sha256.txt")"

      - name: Test della logica condivisa
        run: ./gradlew :core:test --no-daemon

      # Lo script delle novità gira da android/ come qui sotto: i suoi test lo provano così.
      - name: Test degli script della CI
        run: python3 -m unittest discover -s ../.github/scripts -p 'test_*.py'


      - name: Compila l'APK
        run: ./gradlew :app:assembleRelease --no-daemon

      # Ogni APK deve avere la firma della chiave fissa, o gli aggiornamenti dall'app falliscono e
      # serve disinstallare: l'impronta del certificato dell'APK si confronta con quella della chiave.
      - name: Controlla la firma dell'APK
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee firma.txt
          ATTESA="$(tr -d '[:space:]' < "$RUNNER_TEMP/chiave-sha256.txt")"
          if [ -z "$ATTESA" ] || ! grep -qi "certificate SHA-256 digest: $ATTESA" firma.txt; then
            echo "::error::L'APK non è firmato con la chiave fissa del secret ($ATTESA): gli aggiornamenti dall'app fallirebbero."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: baldmusic-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Numero di versione e novità per l'app (Impostazioni → Aggiornamenti). Anche
      # nelle PR, così uno sbaglio nello script si vede prima di arrivare su main.
      - name: Prepara version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk baldmusic.apk
          mkdir -p prev
          gh release download apk-latest -p version.json -D prev --clobber || echo "Nessun version.json precedente."
          python3 ../.github/scripts/apk_version.py --code "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA" \
            --apk baldmusic.apk --prev prev/version.json --out version.json --notes notes.md
          cat notes.md

      # Prima l'APK, poi version.json: l'app scarica l'APK solo quando c'è già quello nuovo.
      - name: Pubblica l'APK nella release "apk-latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 \
            || gh release create apk-latest --title "BaldMusic per Android" --notes "Build in corso."
          gh release upload apk-latest baldmusic.apk --clobber
          gh release upload apk-latest version.json --clobber
          gh release edit apk-latest --notes-file notes.md
