name: App Android

# Compila l'APK su un runner GitHub (che ha l'SDK Android): niente Android
# Studio sul PC. Su main l'APK finisce in una release con link diretto,
# installabile dal browser del telefono.

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Senza una chiave fissa ogni runner ne genera una nuova: ogni APK avrebbe
      # una firma diversa e per aggiornare bisognerebbe disinstallare (perdendo
      # le impostazioni). Il secret ANDROID_DEBUG_KEYSTORE_B64 è la chiave in base64.
      - name: Ripristina la chiave di firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Chiave di firma ripristinata."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 non impostato: ogni APK avrà una firma diversa e per aggiornare servirà disinstallare."
          fi

      - name: Test della logica condivisa
        run: ./gradlew :core:test --no-daemon

      - name: Compila l'APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: baldmusic-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Pubblica l'APK nella release "apk-latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk baldmusic.apk
          gh release view apk-latest >/dev/null 2>&1 \
            || gh release create apk-latest --title "BaldMusic per Android" --notes "Build in corso."
          gh release upload apk-latest baldmusic.apk --clobber
          gh release edit apk-latest --notes \
            "APK compilato da main (commit ${GITHUB_SHA:0:7}, $(date -u '+%d/%m/%Y %H:%M UTC')).

          Scarica \`baldmusic.apk\` qui sotto dal telefono e aprilo: Android chiederà di consentire l'installazione da questa fonte.

          Richiede Android 8.0 o superiore."
